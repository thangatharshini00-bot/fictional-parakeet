{% extends "base.html" %}
{% block content %}
<div class="form-card">
    <h2>Login</h2>
    <form method="POST">
        <label>Email</label>
        <input type="email" name="email" required>

        <label>Password</label>
        <input type="password" name="password" required>

        <button type="submit" class="btn">Login</button>
    </form>
    <p>New here? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
