<!DOCTYPE html>
<html>
<head>
    <title>AI Learning & Study Assistant</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
        }

        nav {
            background: #1e293b;
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        nav a {
            color: white;
            text-decoration: none;
            padding: 9px 12px;
            border-radius: 8px;
            font-weight: bold;
        }

        nav a:hover {
            background: #334155;
        }

        .container {
            padding: 30px;
        }

        .btn {
            display: inline-block;
            padding: 10px 18px;
            background: #1e293b;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        .btn:hover {
            background: #334155;
        }
    </style>
</head>

<body>

<nav>
    <a href="/">🏠 Home</a>
    <a href="/dashboard">📊 Dashboard</a>
    <a href="/notes">📚 Notes</a>
    <a href="/assignments">📝 Assignments</a>
    <a href="/exam">📅 Exam</a>
    <a href="/attendance">📈 Attendance</a>
    <a href="/quiz">🎯 Quiz</a>
    <a href="/chatbot">🤖 AI Assistant</a>
    <a href="/progress">📊 Progress</a>
    <a href="/login">🔐 Login</a>
    <a href="/register">📝 Register</a>
    <a href="/logout">🚪 Logout</a>
</nav>

<div class="container">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
